<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社務執秘登入</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
    body {
        background: linear-gradient(160deg, #4facfe 0%, #00f2fe 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-size: 18px;
        margin: 0;
    }
    .login-panel {
        width: min(480px, 92vw);
        background: #ffffff;
        border-radius: 26px;
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.18);
        padding: clamp(2rem, 6vw, 3rem);
    }
    .login-panel h1 {
        font-size: clamp(2rem, 5vw, 2.4rem);
        font-weight: 700;
        color: #0b3d91;
        text-align: center;
        margin-bottom: 0.5rem;
    }
    .login-panel p {
        text-align: center;
        color: #607196;
        font-size: 1rem;
    }
    .form-label {
        font-size: 1.05rem;
        color: #39507a;
    }
    .form-control {
        font-size: 1.2rem;
        padding: 0.85rem 1rem;
        border-radius: 14px;
    }
    .btn-login {
        width: 100%;
        font-size: 1.25rem;
        padding: 0.85rem;
        border-radius: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        box-shadow: 0 18px 35px rgba(118, 75, 162, 0.25);
    }
    .btn-login:hover {
        box-shadow: 0 22px 40px rgba(118, 75, 162, 0.35);
    }
    .alert {
        font-size: 1rem;
    }
    </style>
</head>
<body>
    <div class="login-panel">
        <h1>社務執秘登入</h1>
        <p>請輸入為貴社設定的帳號與密碼，登入後僅能管理本社參加者報到。</p>
        {% if error %}
        <div class="alert alert-danger mt-3">{{ error }}</div>
        {% endif %}
        <form method="post" class="d-flex flex-column gap-3 mt-4">
            <div>
                <label for="account" class="form-label">帳號</label>
                <input type="text" class="form-control" id="account" name="account" placeholder="輸入帳號" required autofocus>
            </div>
            <div>
                <label for="password" class="form-label">密碼</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="輸入密碼" required>
            </div>
            <button type="submit" class="btn btn-login text-white">登入</button>
        </form>
        <p class="text-muted small mt-3 mb-0">若忘記密碼，請聯繫年會主辦單位或後台管理員。</p>
    </div>
</body>
</html>
