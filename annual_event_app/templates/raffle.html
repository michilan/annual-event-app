<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>抽獎直播</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
    body {
        background: radial-gradient(circle at top, #361999 0%, #2c2c96 25%, #131862 60%, #0f102d 100%);
        min-height: 100vh;
        font-size: 18px;
        color: #ecf0ff;
        display: flex;
        flex-direction: column;
        margin: 0;
    }
    .stage { padding: clamp(1.5rem, 4vw, 3rem); width: 100%; max-width: 1100px; margin: 0 auto; flex: 1; }
    .hero { text-align: center; margin-bottom: clamp(1.8rem, 5vw, 3.2rem); }
    .hero h1 {
        font-size: clamp(2.4rem, 6vw, 3.4rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffd166;
        margin-bottom: 0.6rem;
    }
    .hero p { color: rgba(236,240,255,0.8); font-size: 1.05rem; margin-bottom: 1rem; }
    .hero .actions { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; }
    .hero .btn { border-radius: 12px; padding: 0.75rem 1.5rem; font-size: 1rem; box-shadow: 0 12px 24px rgba(0,0,0,0.25); }
    .now-playing {
        background: rgba(29,35,90,0.7);
        border-radius: 26px;
        padding: clamp(1.5rem, 4vw, 2.5rem);
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
        margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
        position: relative;
        overflow: hidden;
    }
    .now-playing::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top right, rgba(255,221,89,0.35), transparent 55%);
        pointer-events: none;
    }
    .winner-title { font-size: 1rem; letter-spacing: 0.25em; text-transform: uppercase; color: #ffd166; margin-bottom: 0.75rem; }
    .winner-name { font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 900; margin-bottom: 0.4rem; }
    .winner-meta { font-size: 1.05rem; color: rgba(236,240,255,0.8); }
    .winner-meta span { display: inline-block; margin-right: 1rem; }
    .history-card { border-radius: 24px; background: rgba(15,18,52,0.85); padding: clamp(1.2rem, 4vw, 2rem); box-shadow: 0 18px 38px rgba(0,0,0,0.35); }
    .history-card h2 { font-size: 1.6rem; font-weight: 700; color: #70e1f5; margin-bottom: 1rem; }
    .history-list { display: grid; gap: 1rem; max-height: 420px; overflow-y: auto; padding-right: 0.25rem; }
    .history-item {
        background: rgba(43,49,115,0.78);
        border-radius: 16px;
        padding: 1rem 1.25rem;
        display: grid;
        gap: 0.3rem;
        border-left: 6px solid rgba(112,225,245,0.75);
    }
    .history-item.highlight { border-left-color: #ffd166; background: rgba(255,209,102,0.25); box-shadow: 0 12px 25px rgba(255,209,102,0.4); }
    .history-item strong { font-size: 1.15rem; }
    .history-meta { font-size: 0.95rem; color: rgba(236,240,255,0.7); }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(2,5,30,0.85); align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; flex-direction: column; padding: 2rem; }
    .overlay .spinner { width: 140px; height: 140px; border-radius: 50%; border: 10px solid rgba(255,255,255,0.12); border-top-color: #ffd166; animation: spin 1.2s linear infinite; margin-bottom: 1.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 576px) {
        body { font-size: 17px; }
        .history-list { max-height: 320px; }
        .hero .btn { flex: 1 1 45%; font-size: 0.95rem; }
    }
    </style>
</head>
<body>
    <div class="stage">
        <section class="hero">
            <h1>抽獎直播 LIVE</h1>
            <p>抽獎由主控台啟動，本畫面同步揭曉得獎者並保留完整紀錄。</p>
            <div class="actions">
                <a href="{{ url_for('scoreboard') }}" class="btn btn-outline-light btn-sm">節目成績看板</a>
                <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm">回到首頁</a>
            </div>
        </section>

        <section class="now-playing" id="winner-block">
            <div class="winner-title">最新得獎者</div>
            <div id="winner" class="winner-name text-muted">尚未抽出得獎者</div>
            <div class="winner-meta" id="winner-meta"></div>
        </section>

        <section class="history-card">
            <h2>歷史得獎紀錄</h2>
            <div class="history-list" id="results-body">
                <div class="history-item">
                    <strong class="text-muted">尚未抽出任何得獎者</strong>
                    <div class="history-meta">等待抽獎開始⋯⋯</div>
                </div>
            </div>
        </section>
    </div>

    <div class="overlay" id="overlay">
        <div class="spinner"></div>
        <h2 id="overlay-message" class="fw-bold">抽獎進行中，請稍候…</h2>
    </div>

    <script>
    const winnerDiv = document.getElementById('winner');
    const winnerMeta = document.getElementById('winner-meta');
    const resultsBody = document.getElementById('results-body');
    const overlay = document.getElementById('overlay');
    const overlayMessage = document.getElementById('overlay-message');

    let lastResultId = null;
    let initialLoad = true;
    let overlayTimer = null;

    function formatCallName(callName) {
        return callName ? `（${callName}）` : '';
    }

    function formatDate(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return isoString;
        return date.toLocaleString();
    }

    function renderWinner(result) {
        if (!result) {
            winnerDiv.classList.add('text-muted');
            winnerDiv.textContent = '尚未抽出得獎者';
            winnerMeta.textContent = '';
            return;
        }
        winnerDiv.classList.remove('text-muted');
        const callName = formatCallName(result.call_name);
        winnerDiv.textContent = `${result.name || '未命名'}${callName}`;
        const info = [];
        if (result.club_name) info.push(`所屬社：${result.club_name}`);
        if (result.performance) info.push(`節目：${result.performance}`);
        if (result.prize_name) info.push(`獎項：${result.prize_name}`);
        if (result.phase) info.push(`階段：第 ${result.phase} 階段`);
        const drawnAt = formatDate(result.drawn_at);
        if (drawnAt) info.push(`抽出時間：${drawnAt}`);
        winnerMeta.innerHTML = info.join(' ｜ ');
    }

    function renderResults(results) {
        resultsBody.innerHTML = '';
        if (!results || results.length === 0) {
            resultsBody.innerHTML = `
                <div class="history-item">
                    <strong class="text-muted">尚未抽出任何得獎者</strong>
                    <div class="history-meta">等待抽獎開始⋯⋯</div>
                </div>`;
            return;
        }
        const reversed = [...results].reverse();
        for (const result of reversed) {
            const div = document.createElement('div');
            div.className = 'history-item';
            if (lastResultId && result.id === lastResultId) {
                div.classList.add('highlight');
            }
            const callName = formatCallName(result.call_name);
            div.innerHTML = `
                <strong>${result.name || '未命名'}${callName}</strong>
                <div class="history-meta">
                    <div>節目：${result.performance || '未指定'} ｜ 獎項：${result.prize_name || '未設定'}</div>
                    <div>階段：第 ${result.phase || '—'} 階段 ｜ 抽出時間：${formatDate(result.drawn_at) || '—'}</div>
                </div>`;
            resultsBody.appendChild(div);
        }
    }

    function showOverlay(message) {
        overlayMessage.textContent = message;
        overlay.style.display = 'flex';
        if (overlayTimer) clearTimeout(overlayTimer);
        overlayTimer = setTimeout(() => { overlay.style.display = 'none'; }, 5000);
    }

    async function loadRaffleData() {
        try {
            const res = await fetch("{{ url_for('api_raffle_latest') }}?t=" + Date.now());
            if (!res.ok) throw new Error('Network error');
            const data = await res.json();
            const latest = data.latest || null;
            const hasNew = latest && latest.id !== lastResultId;

            if (hasNew && !initialLoad) {
                showOverlay('最新得獎者揭曉，請稍候…');
                setTimeout(() => {
                    renderWinner(latest);
                }, 5000);
            } else {
                renderWinner(latest);
            }

            if (latest) {
                lastResultId = latest.id;
            }
            renderResults(data.results || []);
            initialLoad = false;
        } catch (err) {
            console.error(err);
            winnerDiv.innerHTML = '<span class="text-danger">無法取得抽獎資訊，請稍後再試。</span>';
        }
    }

    loadRaffleData();
    setInterval(loadRaffleData, 5000);
    </script>
</body>
</html>
