<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>節目成績看板</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <style>
    body {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: #fff;
        min-height: 100vh;
    }
    .stage {
        max-width: 960px;
        margin: 0 auto;
        padding: 3rem 1rem 4rem;
    }
    .hero {
        text-align: center;
        margin-bottom: 2.5rem;
    }
    .hero h1 {
        font-size: clamp(2.3rem, 5vw, 3.2rem);
        font-weight: 700;
    }
    .hero p {
        color: rgba(255,255,255,0.8);
    }
    .card {
        border-radius: 18px;
        border: none;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        box-shadow: 0 25px 45px rgba(0,0,0,0.3);
    }
    .table thead {
        background: rgba(255,255,255,0.15);
    }
    .rank-1 { background: rgba(255,215,0,0.18); }
    .rank-2 { background: rgba(192,192,192,0.18); }
    .rank-3 { background: rgba(205,127,50,0.18); }
    .action-bar a {
        margin-right: 0.75rem;
    }
    </style>
</head>
<body>
    <div class="stage">
        <div class="hero">
            <h1>節目成績看板</h1>
            <p>即時查看各節目的平均分數與投票數。數據每次重新整理即可更新。</p>
            <div class="action-bar mt-3">
                <a class="btn btn-outline-light" href="{{ url_for('index') }}">回首頁</a>
                <a class="btn btn-outline-light" href="{{ url_for('raffle_page') }}">抽獎直播</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover text-white align-middle">
                        <thead>
                            <tr>
                                <th scope="col">排名</th>
                                <th scope="col">節目名稱</th>
                                <th scope="col">平均分數</th>
                                <th scope="col">投票人數</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for item in results|sort(attribute='average_score', reverse=True) %}
                            <tr class="rank-{{ loop.index }}">
                                <td>#{{ loop.index }}</td>
                                <td>{{ item.performance.title }}</td>
                                <td>{{ '%.2f'|format(item.average_score) }}</td>
                                <td>{{ item.vote_count }}</td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center text-muted">尚未有投票資料。</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
