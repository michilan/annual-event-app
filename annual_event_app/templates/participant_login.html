<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>參加者登入</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <style>
    body {
        background: linear-gradient(180deg, #0d6efd 0%, #6f42c1 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }
    .login-card {
        width: min(480px, 90vw);
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 25px 60px rgba(13, 110, 253, 0.25);
        padding: 2.5rem 2rem;
    }
    .login-card h1 {
        font-size: 2.2rem;
        font-weight: 700;
        color: #0d6efd;
        text-align: center;
    }
    .form-label {
        font-size: 1.1rem;
    }
    .form-control {
        font-size: 1.3rem;
        padding: 0.85rem 1rem;
    }
    .btn-login {
        font-size: 1.25rem;
        padding: 0.9rem 1.5rem;
    }
    .alert {
        font-size: 1.05rem;
    }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="mb-3">扶輪年會參加者登入</h1>
        <p class="text-muted text-center mb-4">請輸入報到時提供的帳號與密碼。若需要協助，請洽現場工作人員。</p>
        <p class="text-muted small text-center">預設帳號為您的報到編號，密碼同帳號，可於報到處協助更新。</p>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" class="d-flex flex-column gap-3">
            <div>
                <label for="account" class="form-label">帳號</label>
                <input type="text" class="form-control" id="account" name="account" placeholder="輸入帳號" required autofocus>
            </div>
            <div>
                <label for="password" class="form-label">密碼</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="輸入密碼" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">登入</button>
        </form>
        <p class="text-center text-muted mt-4 mb-0" style="font-size: 0.95rem;">尚未報到的參加者請先至報到櫃檯或線上報到頁面完成報到後再登入。</p>
    </div>
</body>
</html>
