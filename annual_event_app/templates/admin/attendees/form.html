{% extends 'admin/base.html' %}
{% block title %}管理後台 - 參加者{% endblock %}
{% block content %}
<div class="py-4">
    <h2>{{ '編輯' if attendee else '新增' }}參加者</h2>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">姓名</label>
            <input type="text" name="name" class="form-control" value="{{ attendee.name if attendee else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">暱稱（Call Name）</label>
            <input type="text" name="call_name" class="form-control" value="{{ attendee.call_name if attendee else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">扶輪社</label>
            <input type="text" name="club_name" class="form-control" value="{{ attendee.club_name if attendee else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">地區</label>
            <input type="text" name="district" class="form-control" value="{{ attendee.district if attendee else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">登入帳號</label>
            <input type="text" name="login_account" class="form-control" value="{{ attendee.login_account if attendee else '' }}" placeholder="若留空，系統將以編號自動產生">
        </div>
        <div class="mb-3">
            <label class="form-label">設定密碼</label>
            <input type="password" name="password" class="form-control" placeholder="{{ '留空則維持原密碼' if attendee else '若留空，將以帳號作為初始密碼' }}">
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="event_checked_in" id="event_checked_in" {% if attendee and attendee.event_checked_in %}checked{% endif %}>
                    <label class="form-check-label" for="event_checked_in">已完成大會報到</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="show_checked_in" id="show_checked_in" {% if attendee and attendee.show_checked_in %}checked{% endif %}>
                    <label class="form-check-label" for="show_checked_in">已完成節目報到</label>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="has_voted" id="has_voted" {% if attendee and attendee.has_voted %}checked{% endif %}>
                    <label class="form-check-label" for="has_voted">已完成評分</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="has_drawn" id="has_drawn" {% if attendee and attendee.has_drawn %}checked{% endif %}>
                    <label class="form-check-label" for="has_drawn">已中獎</label>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">儲存</button>
        <a href="{{ url_for('admin_attendees') }}" class="btn btn-secondary">返回</a>
    </form>
</div>
{% endblock %}
