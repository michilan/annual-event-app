{% extends 'admin/base.html' %}
{% block title %}管理後台 - 儀表板{% endblock %}
{% block content %}
<div class="py-4">
    <h2>儀表板</h2>
    <p class="text-muted">概覽系統資料統計</p>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title">參加者</h5>
                    <p class="display-6">{{ attendee_count }}</p>
                    <a href="{{ url_for('admin_attendees') }}" class="btn btn-primary">管理參加者</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title">節目</h5>
                    <p class="display-6">{{ performance_count }}</p>
                    <a href="{{ url_for('admin_performances') }}" class="btn btn-primary">管理節目</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title">獎品</h5>
                    <p class="display-6">{{ prize_count }}</p>
                    <a href="{{ url_for('admin_prizes') }}" class="btn btn-primary">管理獎品</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
