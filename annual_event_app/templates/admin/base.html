<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}管理後台{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <style>
        body {
            padding-top: 4.5rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">管理後台</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_dashboard') }}">儀表板</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_attendees') }}">參加者</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_performances') }}">節目</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_prizes') }}">獎品</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_import_attendees') }}">批次上傳</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_operators') }}">社務執秘</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_attendees') }}">報到工具</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_raffle') }}">抽獎管理</a></li>
                </ul>
                <span class="navbar-text me-3">管理員</span>
                <a class="btn btn-outline-light" href="{{ url_for('admin_logout') }}">登出</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
            <div class="alert alert-{{ category }} mt-3">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
