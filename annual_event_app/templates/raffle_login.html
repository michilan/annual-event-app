<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>抽獎登入</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h2 class="card-title mb-4">🔒 抽獎系統登入</h2>
                        <p class="text-muted">此頁面僅供工作人員使用。請輸入密碼以進入抽獎頁面。</p>
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        <form method="post">
                            <div class="mb-3">
                                <input type="password" class="form-control" name="password" placeholder="輸入密碼" required autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary">登入</button>
                        </form>
                        <div class="mt-3">
                            <a href="{{ url_for('home') }}" class="btn btn-link">返回首頁</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
